name: Release Build

on:
  workflow_dispatch:

  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    if: github.repository_owner == 'Crazy-Crew'

    uses: Crazy-Crew/.github/.github/workflows/build.yml@main

    with:
      status: "release"
      branch: main

    secrets:
      webhook: ${{ secrets.BUILD_WEBHOOK }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
      hangar_token: ${{ secrets.HANGAR_KEY }}