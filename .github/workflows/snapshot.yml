name: Snapshot Build

on:
  workflow_dispatch:

  push:
    paths-ignore:
      - 'gradle/wrapper/**'
      - '.github/**'
      - '.idea/icon.png'

      - 'changelog.md'
      - 'README.md'
      - 'LICENSE'

      - '.gitignore'

      - 'gradlew.bat'
      - 'gradlew'

    branches:
      - main

jobs:
  build:
    uses: Crazy-Crew/.github/.github/workflows/build.yml@main

    with:
      status: "beta"
      branch: main

    secrets:
      webhook: ${{ secrets.CE_WEBHOOK }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
      hangar_token: ${{ secrets.HANGAR_KEY }}