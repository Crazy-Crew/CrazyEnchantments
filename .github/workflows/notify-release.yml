name: Notify Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository_owner == 'Crazy-Crew'

    uses: Crazy-Crew/.github/.github/workflows/notify.yml@main

    with:
      status: "release"
      branch: main

    secrets:
      webhook: ${{ secrets.BUILD_WEBHOOK }}